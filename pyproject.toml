[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basys-sdr"
version = "0.1.0"
description = "Terminal workbench for the Basys 3 SDR"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5,<4", "windows-curses>=2.3; sys_platform == 'win32'"]

[project.optional-dependencies]
gui = ["aiohttp>=3.9,<4"]

[project.scripts]
sdr = "sdr_cli.cli:main"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["sdr_cli*"]

[tool.setuptools.package-data]
sdr_cli = ["web/static/**/*", "sites.json"]
